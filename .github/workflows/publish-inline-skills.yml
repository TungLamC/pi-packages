name: Publish @tunglam/pi-inline-skills

on:
  push:
    tags:
      - "@tunglam/pi-inline-skills@*"

permissions: {}

concurrency:
  group: publish-pi-inline-skills
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'TungLamC/pi-packages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./packages/pi-inline-skills/package.json').name")"
          package_version="$(node -p "require('./packages/pi-inline-skills/package.json').version")"
          expected_tag="${package_name}@${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match ${expected_tag}." >&2
            exit 1
          fi

      - name: Install dependencies (scripts disabled)
        run: npm ci --ignore-scripts

      - name: Check workspace
        run: npm run check

      - name: Verify package contents
        run: npm run pack:dry-run

      - name: Publish package
        run: npm publish --workspace=@tunglam/pi-inline-skills --ignore-scripts --access public --registry=https://registry.npmjs.org/
