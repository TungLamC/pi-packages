name: Publish pi-inline-skills

on:
  push:
    tags:
      - "pi-inline-skills@*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pi-inline-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'TungLamC/pi-packages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/pi-inline-skills/package.json').version")"
          expected_tag="pi-inline-skills@${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match ${expected_tag}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check workspace
        run: npm run check

      - name: Verify package contents
        run: npm run pack:dry-run

      - name: Publish package
        run: npm publish --workspace=pi-inline-skills --access public --registry=https://registry.npmjs.org/
